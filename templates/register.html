<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container">
    <h2>Student Registration</h2>
    <div id="message" class="message {{ 'error' if error }}">{{ error or '' }}</div>
    <form id="regForm" method="POST" action="{{ url_for('register') }}" novalidate>
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name">

      <label for="email">Email</label>
      <input type="email" id="email" name="email">

      <label for="age">Age</label>
      <input type="text" id="age" name="age">

      <label>Gender</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="Male"> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
        <label><input type="radio" name="gender" value="Other"> Other</label>
      </div>

      <label for="course">Course</label>
      <select id="course" name="course">
        <option value="">-- Select Course --</option>
        {% for c in courses %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
      </select>

      <label for="password">Password</label>
      <input type="password" id="password" name="password">

      <button type="submit" class="btn">Register</button>
    </form>
    <p class="link">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script>
    $(document).ready(function () {
      $("#regForm").on("submit", function (e) {
        var name = $.trim($("#name").val());
        var email = $.trim($("#email").val());
        var age = $.trim($("#age").val());
        var gender = $("input[name='gender']:checked").val();
        var course = $("#course").val();
        var password = $("#password").val();
        var msg = "";

        if (name === "" || email === "" || age === "" || !gender || course === "" || password === "") {
          msg = "All fields are required.";
        } else if (isNaN(age) || !/^\d+$/.test(age)) {
          msg = "Age must be a number.";
        } else if (password.length < 6) {
          msg = "Password must be at least 6 characters.";
        }

        if (msg !== "") {
          e.preventDefault();
          $("#message").addClass("error").text(msg).css("padding", "10px");
          alert(msg);
        }
      });
    });
  </script>
</body>
</html>
